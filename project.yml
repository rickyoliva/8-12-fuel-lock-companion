name: FuelLockCompanion
options:
  bundleIdPrefix: com.rickyoliva
  deploymentTarget:
    iOS: "26.4"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1,2"
    EXCLUDED_ARCHS[sdk=iphonesimulator*]: x86_64
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: ""

targets:
  FuelLockCompanion:
    type: application
    platform: iOS
    sources:
      - path: ios-app
    dependencies:
      - framework: IDevice.xcframework
        embed: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickyoliva.fuellockcompanion
        INFOPLIST_FILE: ios-app/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        OTHER_LDFLAGS: "-lc++"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    scheme:
      testTargets:
        - FuelLockCompanionTests

  FuelLockCompanionTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ios-tests
    dependencies:
      - target: FuelLockCompanion
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.rickyoliva.fuellockcompanion.tests
        GENERATE_INFOPLIST_FILE: YES
