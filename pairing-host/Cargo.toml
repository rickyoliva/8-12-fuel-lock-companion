[package]
name = "pairing_host_ffi"
version = "0.1.0"
edition = "2021"
description = "Minimal C FFI shim over idevice's RPPairing host for 8/12 Fuel Lock Companion"

[lib]
name = "pairing_host_ffi"
crate-type = ["staticlib"]

[dependencies]
idevice = { path = "vendor/idevice", default-features = false, features = [
  "aws-lc",
  "remote_pairing",
] }
libc = "0.2"
plist = "1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "fs", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = "0.3"

[dev-dependencies]
serde_json = "1"

[profile.release]
opt-level = 3
lto = "thin"
